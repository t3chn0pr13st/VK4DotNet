name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore VK4DotNet.slnx
      - run: dotnet build VK4DotNet.slnx -c Release --no-restore
      - run: dotnet test VK4DotNet.slnx -c Release --no-build
      - run: dotnet pack VK4DotNet.slnx -c Release --no-build -o artifacts/release
      - name: Create SHA-256 checksums
        shell: pwsh
        run: |
          Get-ChildItem artifacts/release -File | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)" | Add-Content artifacts/release/SHA256SUMS
          }
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" artifacts/release/* --verify-tag --generate-notes --title "VK4DotNet $GITHUB_REF_NAME"
